name: FundersClub
description: FundersClub is an online venture capital firm and investment platform based in San Francisco
  that lets accredited investors browse, evaluate, and invest in curated early-stage technology startups
  through professionally managed, single-purpose venture funds. Founders apply for funding and, once selected,
  gain access to capital, a partner network, and post-investment support. Backed by a16z, Felicis, and
  Y Combinator, FundersClub pioneered the online VC model. The company publishes no public developer API;
  this API Evangelist profile tracks its web, identity, and domain-security surface for the network.
